name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Import layering contract
        run: lint-imports

      - name: Pytest
        run: pytest

      - name: Secret scan
        run: |
          curl -fsSL -o /tmp/betterleaks.tar.gz https://github.com/betterleaks/betterleaks/releases/download/v1.8.1/betterleaks_1.8.1_linux_x64.tar.gz
          echo "efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a  /tmp/betterleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/betterleaks.tar.gz -C /tmp betterleaks
          git ls-files -z | xargs -0 /tmp/betterleaks dir --no-banner --redact

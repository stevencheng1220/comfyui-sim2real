name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.12'
          enable-cache: true
          activate-environment: true

      - name: Install locked deps and the package
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Import layering contract
        run: lint-imports

      - name: Type check
        run: mypy

      - name: Pytest
        run: pytest

      - name: Export the lock for the audit
        run: uv export --locked --all-extras --no-emit-project --format pylock.toml -o pylock.toml

      - name: Dependency audit
        run: pip-audit --locked .

      - name: Secret scan
        run: |
          curl -fsSL -o /tmp/betterleaks.tar.gz https://github.com/betterleaks/betterleaks/releases/download/v1.8.1/betterleaks_1.8.1_linux_x64.tar.gz
          echo "efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a  /tmp/betterleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/betterleaks.tar.gz -C /tmp betterleaks
          git ls-files -z | xargs -0 /tmp/betterleaks dir --no-banner --redact

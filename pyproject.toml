[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comfyui-sim2real"
version = "0.1.0"
description = "ComfyUI custom nodes for sim-to-real conditioning"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Steven Cheng"}
]
keywords = ["comfyui", "controlnet", "depth", "sim2real", "isaac-sim"]

dependencies = []  # ComfyUI provides torch/numpy/PIL at runtime

[project.optional-dependencies]
dev = [
    "import-linter>=2.15",
    "pytest>=8.0",
    "ruff>=0.16,<0.17",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.importlinter]
root_package = "comfyui_sim2real"

# Higher layers may import lower ones, never the reverse: the nodes read the ADE20K
# palette table, which imports nothing. torch, numpy and Pillow are compute libraries
# ComfyUI supplies, not an outside service, so there is no vendor contract.
[[tool.importlinter.contracts]]
name = "Package layers"
type = "layers"
layers = [
    "comfyui_sim2real.service",
    "comfyui_sim2real.constants",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/comfyui_sim2real"]
